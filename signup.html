<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/nav.js" defer></script>
  <script type="module" src="js/signup.js"></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container container-narrow">
    <h1>สมัครสมาชิก</h1>
    <p class="subtitle">สมัครแล้วจะได้บทบาท ผู้ขอลา · ถ้าต้องการบทบาทอื่นให้แจ้งฝ่ายบุคคล</p>

    <div class="card">
      <div id="ข้อความเตือน" class="alert alert-error hidden"></div>

      <form id="ฟอร์มสมัคร">
        <label for="name">ชื่อ-นามสกุล</label>
        <input type="text" id="name" maxlength="80" placeholder="เช่น สมชาย ใจดี">

        <label for="email">อีเมล</label>
        <input type="email" id="email" autocomplete="username" placeholder="you@example.com">

        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" autocomplete="new-password" placeholder="อย่างน้อย 6 ตัวอักษร">

        <label for="password2">รหัสผ่านอีกครั้ง</label>
        <input type="password" id="password2" autocomplete="new-password" placeholder="พิมพ์รหัสผ่านเดิมซ้ำ">

        <div class="btn-row">
          <button type="submit" id="ปุ่มสมัคร">สมัครสมาชิก</button>
        </div>
      </form>

      <p class="hint">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
    </div>
  </div>
</body>
</html>
