<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>เข้าสู่ระบบ · LeaveEasy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28' fill='none' stroke='%230071e3' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='5.2' width='22' height='19.8' rx='6.2'/%3E%3Cpath d='M3 11.4h22M9.6 3.4v3.6M18.4 3.4v3.6'/%3E%3Cpath d='m10 18.1 2.6 2.6 5.4-5.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300..700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/icons.js" defer></script>
  <script src="js/util.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script type="module" src="js/login.js"></script>
</head>
<body>
  <div id="nav"></div>

  <main class="auth">
    <!-- เครื่องหมายนำสายตาก่อนถึงหัวข้อ — บอกว่ากำลังจะเข้าเว็บอะไรก่อนกรอกรหัสผ่าน
         หน้าล็อกอินที่ไม่บอกว่าเป็นของใครคือหน้าที่คนกลัวจะกรอกรหัสผ่านลงไป -->
    <div class="auth-head">
      <span data-เครื่องหมาย></span>
      <h1>เข้าสู่ระบบ</h1>
      <p>กรอกอีเมลและรหัสผ่านที่ใช้ตอนสมัครไว้</p>
    </div>

    <div class="card">
      <div id="ข้อความเตือน" class="alert alert-error hidden" role="alert"></div>

      <!-- novalidate = ปิดกล่องเตือนของเบราว์เซอร์ทิ้ง แล้วใช้ข้อความไทยของเราเองแทน
           กล่องของเบราว์เซอร์เป็นภาษาเครื่อง หน้าตาคุมไม่ได้ และหายเองใน 5 วินาที -->
      <form id="ฟอร์มเข้าสู่ระบบ" novalidate>
        <div class="field">
          <label for="email">อีเมล</label>
          <input type="email" id="email" autocomplete="username"
                 inputmode="email" autocapitalize="off" spellcheck="false"
                 placeholder="you@example.com">
        </div>

        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <!-- ปุ่มลืมตาอยู่ในกรอบเดียวกับช่องกรอก · js/login.js เป็นคนเติมให้ -->
          <div class="pw">
            <input type="password" id="password" autocomplete="current-password"
                   placeholder="รหัสผ่านของคุณ">
          </div>
        </div>

        <div class="btn-row">
          <button type="submit" id="ปุ่มเข้าสู่ระบบ">เข้าสู่ระบบ</button>
        </div>
      </form>
    </div>

    <p class="auth-alt">ยังไม่มีบัญชี? <a href="signup.html">สมัครสมาชิก</a></p>
  </main>
</body>
</html>
