<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดใบลา · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/util.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script type="module" src="js/leave-request-detail.js"></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>รายละเอียดใบลา</h1>

    <div id="กล่องใบลา" class="card">
      <p>กำลังโหลดข้อมูล…</p>
    </div>

    <div id="กล่องความเห็น" class="card hidden">
      <h2>ความเห็นการอนุมัติ</h2>
      <div id="รายการความเห็น"></div>

      <label for="ข้อความความเห็น">เขียนความเห็นใหม่</label>
      <textarea id="ข้อความความเห็น" placeholder="พิมพ์ความเห็นถึงผู้ขอลา"></textarea>
      <div id="เตือนความเห็น" class="alert alert-error hidden"></div>
      <div class="btn-row">
        <button type="button" id="ปุ่มส่งความเห็น">ส่งความเห็น</button>
      </div>
    </div>

    <div class="btn-row">
      <a class="btn btn-ghost" href="leave-requests.html">← กลับไปหน้ารายการ</a>
    </div>
  </div>

  <!-- หน้าต่างถามยืนยันก่อนลบ · เป็น <dialog> ของ HTML ล้วน ไม่ต้องใช้ไลบรารีเสริม
       ปิดหน้าต่างด้วยปุ่มยกเลิกหรือปุ่ม ESC ก็ได้ ทั้งสองทางแปลว่า "ไม่ลบ" -->
  <dialog id="หน้าต่างยืนยันลบ">
    <h2>ยืนยันการลบใบลา</h2>
    <p id="ข้อความยืนยันลบ"></p>
    <p class="hint">ลบแล้วกู้คืนไม่ได้ · ความเห็นทั้งหมดในใบนี้จะถูกลบไปพร้อมกัน</p>
    <div class="btn-row">
      <button type="button" class="btn-danger" id="ปุ่มยืนยันลบ">ลบใบลานี้</button>
      <button type="button" class="btn-ghost" id="ปุ่มยกเลิกลบ">ยกเลิก</button>
    </div>
  </dialog>
</body>
</html>
